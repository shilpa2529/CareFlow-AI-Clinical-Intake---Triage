name = "careflow-ai"
main = "src/index.ts"
compatibility_date = "2024-10-22"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "careflow-db"
database_id = "be879cb4-8e17-4447-aab2-fb6826ebbaca"
migrations_dir = "./migrations"

[vars]
CLAUDE_MODEL = "claude-3-5-sonnet-20241022"
MAX_INPUT_CHARS = "3000"
DAILY_REQUEST_CAP = "200"
DEMO_MODE = "auto"
